name: Living Tree snapshot
on:
  pull_request:
  push:
jobs:
  source-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test living-tree/test/*.test.mjs
